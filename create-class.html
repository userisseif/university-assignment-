<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the layout fit mobile screens. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create class | FitSync</title>
  <!-- Bootstrap provides ready-made layout and styling classes. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><img src="logo.svg" alt="FitSync logo" width="28" height="28" class="me-2 align-middle">FitSync</a>
        <!-- On small screens, this button opens the navigation links. -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="timetable.html">Timetable</a></li>
          <li class="nav-item"><a class="nav-link" href="class-details.html">Class details</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="create-class.html">Create class</a></li>
          </ul>
          <form class="d-flex mt-3 mt-md-0 ms-md-3" role="search">
            <input class="form-control me-2" type="search" placeholder="Search classes" aria-label="Search classes">
            <button class="btn btn-outline-light" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content" class="container py-5">
    <h1>Create a class</h1>
    <p>Gym managers can enter a class name, time, instructor and room.</p>
    <p class="alert alert-info">Frontend demo: this form checks your input but does not save to a database.</p>
    <!-- Each label is connected to its input by matching for and id values. -->
    <form id="class-form" class="card card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="class-name" class="form-label">Class name</label>
          <input type="text" id="class-name" name="class_name" class="form-control" maxlength="100" required>
        </div>
        <div class="col-md-6">
          <label for="intensity" class="form-label">Intensity</label>
          <select id="intensity" name="intensity" class="form-select" required>
            <option value="">Choose intensity</option>
            <option>Low</option><option>Medium</option><option>High</option><option>Extreme</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="instructor" class="form-label">Instructor</label>
          <select id="instructor" name="instructor" class="form-select" required>
            <option value="">Choose instructor</option>
            <option value="1">Sarah Jenkins — Cardio</option>
            <option value="2">Mike Ross — Yoga</option>
            <option value="3">Dave Bautista — Strength</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="room" class="form-label">Room</label>
          <select id="room" name="room" class="form-select" required>
            <option value="">Choose room</option>
            <option value="1">Studio A — capacity 30</option>
            <option value="2">Studio B — capacity 20</option>
            <option value="3">Weights — capacity 15</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="date" class="form-label">Date</label>
          <input type="date" id="date" name="date" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="time" class="form-label">Start time</label>
          <input type="time" id="time" name="time" class="form-control" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-success">Check class details</button>
          <button type="reset" class="btn btn-outline-secondary">Clear form</button>
        </div>
      </div>
    </form>
  </main>

  <footer class="border-top py-4 text-center">
    <p class="mb-0">FitSync &middot; Apex Fitness Center</p>
  </footer>
  <!-- Bootstrap JavaScript makes the mobile navigation button work. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
